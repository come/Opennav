name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The safety-critical arithmetic has no Android dependency, so it gets its own job:
  # it runs in well under a minute and it is the one that must never go red.
  core:
    name: core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:depth:test :core:geo:test --configure-on-demand

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: |
            core/depth/build/reports/tests/test
            core/geo/build/reports/tests/test

  pipeline:
    name: pipeline tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The encoder, the PMTiles writer and the sample generator need only the standard
      # library. rasterio is installed so that the GDAL pipeline tests run too -- that is
      # the script where a sign error would quietly make every depth optimistic, so it is
      # worth the thirty seconds. osmium and the reference MVT decoder are installed for
      # the same reason: without them the OSM builders and the hand-rolled protobuf are
      # not tested at all, and the suite says so only by quietly skipping.
      - name: Install the pipeline dependencies
        run: pip install -r tools/requirements.txt -r tools/requirements-dev.txt

      # OPENNAV_STRICT_TESTS turns "skipped because a library is missing" into a
      # failure. On a contributor's machine those tests still skip politely.
      - name: Tests
        run: python3 -m unittest discover -s tools -v
        env:
          OPENNAV_STRICT_TESTS: "1"

      - name: Generate the sample archive
        run: python3 tools/make_sample_pmtiles.py --out sample-brest-synthetic.pmtiles

      - uses: actions/upload-artifact@v4
        with:
          name: sample-chart
          path: sample-brest-synthetic.pmtiles

  android:
    name: APK
    runs-on: ubuntu-latest
    # The MapLibre AAR alone is ~200 MB, so a cold cache is slow -- but not this slow.
    # Without a cap a wedged runner sits on the default six-hour timeout.
    timeout-minutes: 30
    # The `secrets` context is not available in a step-level `if`, so the keystore is
    # lifted into the job environment here and the steps test that instead.
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      OPENNAV_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      OPENNAV_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      OPENNAV_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # A real signing key can be supplied by adding the RELEASE_KEYSTORE_BASE64 secret.
      # Without it the build falls back to ci/opennav-ci.keystore, which is committed so
      # that every build installs over the previous one instead of demanding an
      # uninstall. See ci/README.md -- that key is not a release key.
      - name: Decode the release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "OPENNAV_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Which key is in use
        run: ./gradlew :app:printSigningReport

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Gradle only prints the first lint failure. Dumping the report turns a
      # one-error-per-CI-round grind into a single pass.
      - name: Lint report
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          [ -f "$report" ] && cat "$report" || echo "no lint report produced"

      # Debug first, and uploaded before the release build starts. This is the APK you
      # actually put on the phone while iterating, and R8 on the release variant is by
      # far the slowest step in the workflow -- no reason to make the installable build
      # wait behind it, or to lose it if it fails.
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: opennav-apk-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: opennav-apk-release
          path: app/build/outputs/apk/release/*.apk

      # Both variants are signed with the same key on purpose, so either can replace the
      # other on a phone. If these two fingerprints ever differ, that has broken.
      - name: Report the APK signatures
        if: always()
        run: |
          set -eu
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" || true
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/outputs/logs
