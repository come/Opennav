name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The safety-critical arithmetic has no Android dependency, so it gets its own job:
  # it runs in well under a minute and it is the one that must never go red.
  core:
    name: core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:depth:test :core:geo:test --configure-on-demand

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: |
            core/depth/build/reports/tests/test
            core/geo/build/reports/tests/test

  pipeline:
    name: pipeline tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The encoder, the PMTiles writer and the sample generator only need the standard
      # library; rasterio is just for build_bathymetry.py, which these tests do not run.
      - name: Tests
        run: python3 -m unittest discover -s tools -v

      - name: Generate the sample archive
        run: python3 tools/make_sample_pmtiles.py --out sample-brest-synthetic.pmtiles

      - uses: actions/upload-artifact@v4
        with:
          name: sample-chart
          path: sample-brest-synthetic.pmtiles

  android:
    name: APK
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if`, so the keystore is
    # lifted into the job environment here and the steps test that instead.
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      OPENNAV_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      OPENNAV_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      OPENNAV_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # A real signing key can be supplied by adding the RELEASE_KEYSTORE_BASE64 secret.
      # Without it the build falls back to ci/opennav-ci.keystore, which is committed so
      # that every build installs over the previous one instead of demanding an
      # uninstall. See ci/README.md -- that key is not a release key.
      - name: Decode the release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "OPENNAV_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Which key is in use
        run: ./gradlew :app:printSigningReport

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Gradle only prints the first lint failure. Dumping the report turns a
      # one-error-per-CI-round grind into a single pass.
      - name: Lint report
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          [ -f "$report" ] && cat "$report" || echo "no lint report produced"

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Report the APK signature
        run: |
          set -eu
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: opennav-apk
          path: app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/outputs/logs
